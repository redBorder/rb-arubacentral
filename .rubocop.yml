AllCops:
  TargetRubyVersion: 3.4
  NewCops: disable
  SuggestExtensions: false
Layout/LineLength:
  Max: 180
Metrics/MethodLength:
  Max: 200
Metrics/BlockLength:
  Max: 30
Metrics/ParameterLists:
  Max: 8
Metrics/ClassLength:
  Max: 240
Metrics/AbcSize:
  Max: 45
Metrics/CyclomaticComplexity:
  Max: 8
Style/FrozenStringLiteralComment:
  Enabled: false
